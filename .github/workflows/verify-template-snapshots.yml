name: Verify template snapshots

on:
  pull_request:
    paths:
      - 'template/**'
      - 'template-shell/**'
      - 'template-shell-legacy/**'
      - 'scripts/sync-*.mjs'
      - 'scripts/template-tree-hash.mjs'
      - 'scripts/verify-template-snapshots.mjs'
      - 'scripts/lib/template-*.mjs'
      - 'scripts/check-embedded-template.mjs'
      - '.github/workflows/sync-templates.yml'
      - '.github/workflows/verify-template-snapshots.yml'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14'

      - name: Install
        run: npm ci

      - name: Verify snapshot metadata and content hashes
        run: npm run verify:template-snapshots
