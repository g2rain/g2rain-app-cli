name: Sync templates

on:
  workflow_dispatch:
    inputs:
      app_template_ref:
        description: "g2rain-app-template Git tag (optional if shell_template_ref set)"
        required: false
        type: string
      shell_template_ref:
        description: "g2rain-shell-template Git tag (optional if app_template_ref set)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-templates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one template ref
        env:
          APP_REF: ${{ inputs.app_template_ref }}
          SHELL_REF: ${{ inputs.shell_template_ref }}
        run: |
          if [ -z "${APP_REF}" ] && [ -z "${SHELL_REF}" ]; then
            echo "Provide app_template_ref and/or shell_template_ref"
            exit 1
          fi

      - name: Checkout CLI
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Checkout app template
        if: ${{ inputs.app_template_ref != '' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: g2rain/g2rain-app-template
          ref: ${{ inputs.app_template_ref }}
          path: .sources/app-template
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          fetch-depth: 0

      - name: Checkout shell template
        if: ${{ inputs.shell_template_ref != '' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: g2rain/g2rain-shell-template
          ref: ${{ inputs.shell_template_ref }}
          path: .sources/shell-template
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Sync app template
        if: ${{ inputs.app_template_ref != '' }}
        env:
          G2RAIN_TEMPLATE_SOURCE: ${{ github.workspace }}/.sources/app-template
          G2RAIN_APP_TEMPLATE_REF: ${{ inputs.app_template_ref }}
        run: npm run sync:template

      - name: Sync shell template
        if: ${{ inputs.shell_template_ref != '' }}
        env:
          G2RAIN_SHELL_TEMPLATE_SOURCE: ${{ github.workspace }}/.sources/shell-template
          G2RAIN_SHELL_TEMPLATE_REF: ${{ inputs.shell_template_ref }}
        run: npm run sync:template:shell

      - name: Verify snapshot metadata and content hashes
        run: npm run verify:template-snapshots

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Tarball smoke (app + shell + legacy)
        run: |
          set -euo pipefail
          TARBALL=$(ls create-g2rain-app-*.tgz | head -n1)
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          npx create-g2rain-app app smoke-app --context-path smoke
          test ! -f smoke-app/.g2rain-template-meta.json
          test ! -f smoke-app/.g2rain-template-snapshot.md
          npx create-g2rain-app shell smoke-shell --context-path admin --port 3000
          test ! -d smoke-shell/src/platform/legacy
          test ! -f smoke-shell/.g2rain-template-meta.json
          npx create-g2rain-app shell smoke-shell-legacy --context-path admin --port 3000 --with-legacy
          test -f smoke-shell-legacy/src/platform/legacy/registry.ts
          # Verify the unpublished CLI candidate inside the generated app too.
          (cd smoke-app && npm install --save-dev --save-exact "$GITHUB_WORKSPACE/$TARBALL" && npm run build)
          (cd smoke-shell && npm install && npm run build)
          (cd smoke-shell-legacy && npm install && npm run build)

      - name: Collect AppKit versions
        id: appkit
        run: |
          APP_HTTP=$(node -e "const p=require('./template/package.json'); console.log((p.dependencies||{})['@g2rain/http']||(p.devDependencies||{})['@g2rain/http']||'n/a')")
          SHELL_HTTP=$(node -e "const p=require('./template-shell/package.json'); console.log((p.dependencies||{})['@g2rain/http']||(p.devDependencies||{})['@g2rain/http']||'n/a')")
          echo "app_http=$APP_HTTP" >> "$GITHUB_OUTPUT"
          echo "shell_http=$SHELL_HTTP" >> "$GITHUB_OUTPUT"
          APP_META=$(node -e "const m=require('./template/.g2rain-template-meta.json'); console.log(m.sourceRef+' '+m.sourceCommit)")
          SHELL_META=$(node -e "const m=require('./template-shell/.g2rain-template-meta.json'); console.log(m.sourceRef+' '+m.sourceCommit)")
          echo "app_meta=$APP_META" >> "$GITHUB_OUTPUT"
          echo "shell_meta=$SHELL_META" >> "$GITHUB_OUTPUT"

      - name: Commit and push sync branch
        id: push
        env:
          APP_REF: ${{ inputs.app_template_ref }}
          SHELL_REF: ${{ inputs.shell_template_ref }}
          APP_META: ${{ steps.appkit.outputs.app_meta }}
          SHELL_META: ${{ steps.appkit.outputs.shell_meta }}
          APP_HTTP: ${{ steps.appkit.outputs.app_http }}
          SHELL_HTTP: ${{ steps.appkit.outputs.shell_http }}
        run: |
          set -euo pipefail
          BRANCH=chore/sync-templates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add template template-shell template-shell-legacy
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Sync templates"
              echo
              echo "No snapshot changes to commit. Branch \`$BRANCH\` was not updated."
              echo
              echo "- App template input: \`${APP_REF:-'(unchanged)'}\`"
              echo "- Shell template input: \`${SHELL_REF:-'(unchanged)'}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore(templates): sync managed template snapshots"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          {
            echo "## Sync templates"
            echo
            echo "Pushed branch \`$BRANCH\`. Open and merge the PR manually (Actions cannot create PRs in this org)."
            echo
            echo "### Summary"
            echo
            echo "- App template input: \`${APP_REF:-'(unchanged)'}\`"
            echo "- Shell template input: \`${SHELL_REF:-'(unchanged)'}\`"
            echo "- App snapshot: \`$APP_META\`"
            echo "- Shell snapshot: \`$SHELL_META\`"
            echo "- Legacy overlay: present"
            echo "- App \`@g2rain/http\`: \`$APP_HTTP\`"
            echo "- Shell \`@g2rain/http\`: \`$SHELL_HTTP\`"
            echo "- CLI test: passed"
            echo "- Tarball smoke test: passed"
            echo
            echo "Do not edit snapshot directories by hand."
            echo
            echo "### Create PR"
            echo
            echo '```bash'
            echo "gh pr create --repo ${GITHUB_REPOSITORY} --base ${GITHUB_REF_NAME} --head ${BRANCH} \\"
            echo "  --title 'chore(templates): sync managed template snapshots' \\"
            echo "  --body \"\$(cat <<'EOF'"
            echo "## Summary"
            echo "- App template input: ${APP_REF:-'(unchanged)'}"
            echo "- Shell template input: ${SHELL_REF:-'(unchanged)'}"
            echo "- App snapshot: ${APP_META}"
            echo "- Shell snapshot: ${SHELL_META}"
            echo "- Legacy overlay: present"
            echo "- App \`@g2rain/http\`: ${APP_HTTP}"
            echo "- Shell \`@g2rain/http\`: ${SHELL_HTTP}"
            echo "- CLI test: passed"
            echo "- Tarball smoke test: passed"
            echo
            echo "Do not edit snapshot directories by hand."
            echo "EOF"
            echo ")\""
            echo '```'
            echo
            echo "If an open PR already uses \`$BRANCH\`, refresh it and merge that PR instead of opening a second one."
          } >> "$GITHUB_STEP_SUMMARY"
